<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html>
<head>
    <title>Decrypt and Show</title>
	<script src="buffer.js"></script>
	<script src="db.js"></script>
</head>
<body>
    <h2>Decrypt and show</h2>
    <input type="password" id="password" placeholder="Enter password">
    <button id="showTabBtn">show</button>
		<button id="showTabBtn2">show2</button>
	<button id="showTabBtn3">show3</button>
	<input type="checkbox" id="showPlayer">below
	<div>
		<video id="videoPlayer" controls width="100%" style="display:none;" ></video>
	</div>
	
	<a href="./download/myFile" target="_blank">Open myFile</a>
	<a href="./viewer.html" target="_blank">Open viewer</a>

    <script>
	     // Register the service worker
		if ('serviceWorker' in navigator) {
		  navigator.serviceWorker.register('./sw.js').then(() => {
			console.log('Service Worker registered');
		  });
		}
	
	
	    const checkbox = document.getElementById("showPlayer");
		const player = document.getElementById("videoPlayer");

		
		checkbox.addEventListener("change", () => {		
			player.style.display = checkbox.checked ? "block" : "none";		
		});

	
        document.getElementById("showTabBtn").onclick = async () => {
            const password = document.getElementById("password").value;
			// Fetch encrypted file from same folder on the server
            const response = await fetch("01AK-Cha Cha Cha.mp4.enc"); // Change filename if needed
            const arrayBuffer = await response.arrayBuffer();
			
            if (arrayBuffer && password) 
			{ 
				const decryptedArrayBuffer = await BUFFER().decrypt(arrayBuffer, password);
				
				if (decryptedArrayBuffer) 
				{
					if (!checkbox.checked) {
						//BUFFER().displayInTab(decryptedArrayBuffer, "video/mp4");
						//BUFFER().openArrayBufferInNewWindow(decryptedArrayBuffer, "video/mp4");
						const blob = new Blob([decryptedArrayBuffer], { type: "video/mp4" });
						await DB().saveToIndexedDB("files", "myFile", blob)
						
						// After decryption + storage
                        const newWin = window.open("./download/myFile", "_blank");
						
						// Periodically check if it's closed
						const timer = setInterval(() => {
						  if (newWin.closed) {
							console.log('The window has been closed!');
							clearInterval(timer); // stop checking
							
							// todo remove "myFile" from indexed db
							
							
						  }
						}, 1000); // check every second
						
						
						
						
                        // or <a href="/download/myfile" download>Download</a>

					}
					else {
						const blob = new Blob([decryptedArrayBuffer], { type: "video/mp4" });
						const url = URL.createObjectURL(blob);
						player.src = url;
						player.play();
					}
				}				
			}
        };
				

		document.getElementById("showTabBtn3").onclick = () => {
			
			const password = document.getElementById("password").value;
			BUFFER().showInNewTab("01AK-Cha Cha Cha.mp4.enc", password, "video/mp4");
		};
		
		
		
		document.getElementById("showTabBtn2").onclick = () => {
		
			let objectUrl = null;
			const password = document.getElementById("password").value;
			const BufPromise = BUFFER().getDecrypted("01AK-Cha Cha Cha.mp4.enc", password);
			
			BufPromise.then(buffer => {
			  if (!buffer) {
				console.error("Fetch error:", buffer);
				return false;
			  }
			  const blob = new Blob([buffer], { type: "video/mp4" } );
			  objectUrl = URL.createObjectURL(blob);
			  return true;	
			})
			.catch(err => {
			  console.error("Network or processing error:", err);
			});

			// Periodically check if it's closed
			const timer = setInterval(() => {
			  if (objectUrl) {
				console.log(objectUrl);
				clearInterval(timer); // stop checking

				const newTab = window.open(objectUrl, "_blank");
	   
				// Poll to check if the tab is closed to revoke url
				const checkClosed = setInterval(() => {
				if (newTab.closed) {
					clearInterval(checkClosed);
					URL.revokeObjectURL(objectUrl);                     
				}}, 1000); // Check every second
			  }
			}, 100); // check every second	
		};
		
    </script>
</body>
</html>
